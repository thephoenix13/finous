name: App CI

# Checks the PWA in app/. Runs on every pull request, with no path filter, because this job is a
# required check on main: a filtered-out run would never report and would block the merge forever.
# The job takes about 40 seconds, so running it for marketing-site changes is cheap.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Typecheck, test, build, PWA check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Installs the service worker in real Chrome, goes offline, and checks nothing financial is cached.
      # Chrome is preinstalled on ubuntu-latest; the script adds --no-sandbox when CI is set.
      - name: PWA install and offline check
        run: npm run test:pwa
