name: Console CI

# Checks the institution console in console/. Runs on every pull request, with no path filter, like App CI.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: console-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: console

jobs:
  check:
    name: Typecheck, test, build (console)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: console/.nvmrc
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
