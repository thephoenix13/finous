<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Finous — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════
     TOKENS
     ═══════════════════════════════════════════════════ */
  :root {
    --bone: #FBFAF7;
    --bone-2: #F3F1EC;
    --ink: #1A1A1A;
    --ink-2: #666666;
    --ink-3: #999999;
    --border: #E8E5DE;
    --ink-deep: #2A2D34;
    --burnt: #C05621;
    --forest: #2F6F4E;
    --brick: #A02828;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);

    --r-card: 12px;
    --r-btn: 10px;
    --r-pill: 100px;

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #EDEAE3;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'tnum' 1, 'cv11' 1;
    letter-spacing: -0.005em;
  }

  /* ═══════════════════════════════════════════════════
     STAGE
     ═══════════════════════════════════════════════════ */
  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    gap: 20px;
  }

  .caption {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    max-width: 400px;
    text-align: center;
  }
  .caption-name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .caption-desc {
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.5;
    max-width: 44ch;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: var(--bone);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.05), 0 0 0 8px #FFFFFF inset;
    position: relative;
    flex-shrink: 0;
  }

  /* ═══════════════════════════════════════════════════
     APP
     ═══════════════════════════════════════════════════ */
  .app {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bone);
    overflow: hidden;
  }

  .status-bar {
    height: 44px;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    flex-shrink: 0;
    z-index: 5;
    letter-spacing: -0.01em;
  }
  .status-bar .sb-r {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .status-bar svg { display: block; }

  .screens {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bone);
    overflow: hidden;
  }

  .screen-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .screen-scroll::-webkit-scrollbar { display: none; }

  /* Tab bar */
  .tabbar {
    flex-shrink: 0;
    height: 76px;
    padding: 8px 8px max(12px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--bone);
    border-top: 1px solid var(--border);
    z-index: 10;
  }
  .tabbar.hidden { display: none; }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color: var(--ink-3);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer;
    user-select: none;
    background: none;
    border: none;
    font-family: inherit;
    padding: 6px 0 0;
    transition: color 0.15s;
  }
  .tab.active { color: var(--ink); }
  .tab.active svg { stroke-width: 1.8; }
  .tab svg { stroke: currentColor; }

  /* ═══════════════════════════════════════════════════
     TRANSITIONS
     ═══════════════════════════════════════════════════ */
  @keyframes pushIn {
    from { transform: translate3d(100%, 0, 0); }
    to { transform: translate3d(0, 0, 0); }
  }
  @keyframes pushOut {
    from { transform: translate3d(0, 0, 0); opacity: 1; }
    to { transform: translate3d(-22%, 0, 0); opacity: 0.6; }
  }
  @keyframes popIn {
    from { transform: translate3d(-22%, 0, 0); opacity: 0.6; }
    to { transform: translate3d(0, 0, 0); opacity: 1; }
  }
  @keyframes popOut {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(100%, 0, 0); }
  }
  @keyframes tabLIn {
    from { transform: translate3d(-14%, 0, 0); opacity: 0; }
    to { transform: translate3d(0, 0, 0); opacity: 1; }
  }
  @keyframes tabRIn {
    from { transform: translate3d(14%, 0, 0); opacity: 0; }
    to { transform: translate3d(0, 0, 0); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .screen.push-in { animation: pushIn 260ms cubic-bezier(0.32, 0.72, 0, 1); }
  .screen.push-out { animation: pushOut 260ms cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  .screen.pop-in { animation: popIn 260ms cubic-bezier(0.32, 0.72, 0, 1); }
  .screen.pop-out { animation: popOut 260ms cubic-bezier(0.32, 0.72, 0, 1) forwards; }
  .screen.tab-l-in { animation: tabLIn 180ms ease-out; }
  .screen.tab-r-in { animation: tabRIn 180ms ease-out; }
  .screen.fade-in { animation: fadeIn 240ms ease-out; }

  /* ═══════════════════════════════════════════════════
     TYPOGRAPHY
     ═══════════════════════════════════════════════════ */
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .serif {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .serif-i {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
  }
  .h-40 { font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.05; }
  .h-28 { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; }
  .h-22 { font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; font-weight: 400; letter-spacing: -0.01em; line-height: 1.25; }
  .h-17 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.35; }
  .h-15 { font-size: 15px; font-weight: 500; letter-spacing: -0.005em; line-height: 1.4; }
  .body { font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--ink-2); }
  .body-ink { font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--ink); }
  .sm { font-size: 13px; font-weight: 400; line-height: 1.5; color: var(--ink-2); }
  .xs { font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--ink-3); }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
  .pos { color: var(--forest); }
  .neg { color: var(--brick); }
  .burnt { color: var(--burnt); }

  /* ═══════════════════════════════════════════════════
     LAYOUT HELPERS
     ═══════════════════════════════════════════════════ */
  .pad { padding-left: 20px; padding-right: 20px; }
  .pad-t-4 { padding-top: 16px; }
  .pad-t-5 { padding-top: 24px; }
  .pad-t-6 { padding-top: 32px; }
  .pad-b-4 { padding-bottom: 16px; }
  .pad-b-5 { padding-bottom: 24px; }
  .pad-b-6 { padding-bottom: 32px; }
  .flex { display: flex; }
  .col { flex-direction: column; }
  .between { justify-content: space-between; }
  .center { align-items: center; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .gap-4 { gap: 16px; }
  .gap-5 { gap: 24px; }
  .grow { flex: 1; }
  .mt-2 { margin-top: 8px; }
  .mt-3 { margin-top: 12px; }
  .mt-4 { margin-top: 16px; }
  .mt-5 { margin-top: 24px; }
  .mt-6 { margin-top: 32px; }
  .mb-3 { margin-bottom: 12px; }
  .mb-4 { margin-bottom: 16px; }
  .mb-5 { margin-bottom: 24px; }

  .divider { height: 1px; background: var(--border); }
  .hr-24 { height: 1px; background: var(--border); margin: 24px 0; }

  /* ═══════════════════════════════════════════════════
     COMPONENTS
     ═══════════════════════════════════════════════════ */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 52px;
    border-radius: var(--r-btn);
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    cursor: pointer;
    transition: opacity 0.15s;
    padding: 0 20px;
  }
  .btn:active { opacity: 0.85; }
  .btn-primary { background: var(--ink-deep); color: #FFFFFF; }
  .btn-accent { background: var(--burnt); color: #FFFFFF; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .btn-quiet {
    background: var(--bone-2);
    color: var(--ink);
  }

  .field {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 52px;
    background: var(--bone-2);
    border: 1px solid transparent;
    border-radius: var(--r-btn);
    padding: 0 16px;
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
  }
  .field .placeholder { color: var(--ink-3); }
  .field.focus { border-color: var(--ink-deep); background: var(--bone); }
  .field svg { stroke: var(--ink-3); flex-shrink: 0; }

  .card {
    background: var(--bone);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    padding: 20px;
  }
  .card-flat {
    background: var(--bone-2);
    border-radius: var(--r-card);
    padding: 16px 18px;
    border: 1px solid transparent;
  }
  .card-shadow {
    background: var(--bone);
    border-radius: var(--r-card);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .row:active { background: var(--bone-2); }
  .row + .row { border-top: 1px solid var(--border); }

  .row-icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bone-2);
    border-radius: 10px;
    flex-shrink: 0;
  }
  .row-icon svg { stroke: var(--ink); }

  .row-title { font-size: 15px; font-weight: 500; color: var(--ink); letter-spacing: -0.005em; }
  .row-sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .row-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .row-chev svg { stroke: var(--ink-3); }

  .nav {
    display: flex;
    align-items: center;
    height: 52px;
    padding: 0 12px 0 8px;
    flex-shrink: 0;
  }
  .nav-back {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    border-radius: 50%;
  }
  .nav-back:active { background: var(--bone-2); }
  .nav-back svg { stroke: var(--ink); }
  .nav-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.005em;
  }

  /* Tab bar dots for charts */
  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 500;
  }
  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ═══════════════════════════════════════════════════
     SPECIFIC SCREENS
     ═══════════════════════════════════════════════════ */

  /* Splash */
  .splash-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: var(--bone);
  }
  .splash-wordmark {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 42px;
    font-weight: 400;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .splash-loader {
    width: 40px;
    height: 1px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
    position: relative;
  }
  .splash-loader::after {
    content: '';
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    width: 40%;
    background: var(--ink);
    animation: load 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }
  @keyframes load {
    0% { left: -40%; }
    100% { left: 100%; }
  }

  /* Welcome */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 20px 32px;
  }

  /* Consent */
  .consent-line {
    display: flex;
    gap: 14px;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .consent-line:last-child { border-bottom: none; }
  .consent-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--ink-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 3px;
  }
  .consent-check svg { stroke: #FFFFFF; }
  .consent-text { flex: 1; }
  .consent-title { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 3px; }
  .consent-desc { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

  /* OTP */
  .otp-row {
    display: flex;
    gap: 10px;
    margin-top: 28px;
  }
  .otp-cell {
    flex: 1;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bone-2);
    border: 1px solid transparent;
    border-radius: 10px;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .otp-cell.filled { background: var(--bone); border-color: var(--ink-deep); }
  .otp-cell.cursor { background: var(--bone); border-color: var(--ink); }

  /* Sync */
  .sync-ring {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    border-top-color: var(--ink);
    animation: spin 900ms linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--ink);
  }
  .sync-item:last-child { border-bottom: none; }
  .sync-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--forest);
    flex-shrink: 0;
  }
  .sync-item.pending .dot { background: var(--border); }
  .sync-item.pending { color: var(--ink-3); }

  /* Home */
  .home-hero {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .home-nw-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .home-nw-value {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 52px;
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .home-nw-delta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--forest);
    margin-top: 12px;
  }
  .home-nw-delta.neg { color: var(--brick); }

  .kv-split {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .kv-l { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .kv-v { font-size: 17px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

  .look-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .look-row:last-child { border-bottom: none; }
  .look-row:active { background: var(--bone-2); }
  .look-num {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    min-width: 18px;
    padding-top: 2px;
  }
  .look-title { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 4px; letter-spacing: -0.005em; line-height: 1.4; }
  .look-desc { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

  /* Charts */
  .chart-wrap { width: 100%; }
  .chart-svg { width: 100%; display: block; }
  .chart-axis {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  /* Segmented */
  .seg {
    display: flex;
    background: var(--bone-2);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }
  .seg-item {
    flex: 1;
    text-align: center;
    padding: 8px 0;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--ink-2);
    border-radius: 8px;
    cursor: pointer;
  }
  .seg-item.active {
    background: var(--bone);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  /* Slider */
  .slider-lbl {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .slider-lbl .l { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .slider-lbl .v { font-size: 16px; color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .slider-track {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    margin-bottom: 6px;
  }
  .slider-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: var(--ink);
    border-radius: 2px;
  }
  .slider-thumb {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px;
    background: var(--bone);
    border: 1.5px solid var(--ink);
    border-radius: 50%;
  }

  /* Big number result */
  .result-num {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 44px;
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .result-lbl {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 10px;
  }
  .result-split {
    display: flex;
    justify-content: space-between;
    padding-top: 20px;
    margin-top: 24px;
    border-top: 1px solid var(--border);
  }
  .result-split-item { }
  .result-split-item .k { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .result-split-item .v { font-size: 15px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Health score */
  .score-top {
    padding: 24px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .score-num {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 88px;
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

const screensEl = document.getElementById('screens');
const tabbarEl = document.getElementById('tabbar');
const capName = document.getElementById('cap-name');
const capDesc = document.getElementById('cap-desc');

function currentScreenId() {
  if (state.mode === 'onboarding') return state.obStep;
  const stack = state.stacks[state.activeTab];
  return stack[stack.length - 1];
}

function screenMeta(id) {
  const s = SCREENS[id];
  if (!s) return { caption: [id, ''], body: () => '<div style="padding:20px">Missing screen</div>' };
  return s;
}

function renderChrome(id) {
  const s = screenMeta(id);
  capName.textContent = s.caption[0];
  capDesc.textContent = s.caption[1];

  // Tab bar visibility
  if (state.mode === 'onboarding') {
    tabbarEl.classList.add('hidden');
  } else {
    tabbarEl.classList.remove('hidden');
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === state.activeTab);
    });
  }
}

function renderScreen(id, animation) {
  const s = screenMeta(id);
  const next = document.createElement('div');
  next.className = 'screen';
  next.innerHTML = s.body();
  if (animation) next.classList.add(animation);

  const old = screensEl.querySelector('.screen');
  if (old) {
    if (animation === 'push-in') old.classList.add('push-out');
    else if (animation === 'pop-in') old.classList.add('pop-out');
    else if (animation === 'tab-l-in' || animation === 'tab-r-in') old.remove();
    else old.remove();
    if (old.parentNode) {
      setTimeout(() => { try { old.remove(); } catch(e){} }, animation === 'push-in' || animation === 'pop-in' ? 280 : 0);
    }
  }

  screensEl.appendChild(next);
  renderChrome(id);
}

function go(id, animation = 'push-in') {
  if (state.mode === 'onboarding') {
    state.obStep = id;
    renderScreen(id, 'fade-in');
    if (id === 'splash') {
      setTimeout(() => { if (state.obStep === 'splash') go('welcome','fade-in'); }, 1200);
    }
    return;
  }
  // Determine which tab this screen belongs to
  const tab = TAB_OF_SCREEN[id];
  if (!tab) {
    // treat as push in current tab
    state.stacks[state.activeTab].push(id);
    renderScreen(id, animation);
    return;
  }
  if (tab !== state.activeTab) {
    // Cross-tab navigation: push onto that tab's stack, switch tab
    state.stacks[tab].push(id);
    switchTab(tab);
    return;
  }
  state.stacks[state.activeTab].push(id);
  renderScreen(id, animation);
}

function goBack() {
  const stack = state.stacks[state.activeTab];
  if (stack.length <= 1) return;
  stack.pop();
  renderScreen(stack[stack.length - 1], 'pop-in');
}

function switchTab(tab) {
  if (tab === state.activeTab) {
    // Already on this tab — pop to root
    state.stacks[tab] = [state.stacks[tab][0]];
    renderScreen(state.stacks[tab][0], 'fade-in');
    return;
  }
  const fromIdx = TAB_ORDER.indexOf(state.activeTab);
  const toIdx = TAB_ORDER.indexOf(tab);
  const direction = toIdx > fromIdx ? 'tab-r-in' : 'tab-l-in';
  state.activeTab = tab;
  renderScreen(state.stacks[tab][state.stacks[tab].length - 1], direction);
}

function enterApp() {
  state.mode = 'app';
  state.activeTab = 'home';
  renderScreen('home', 'fade-in');
}

// Tab bar listeners
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// Browser back support (in case)
window.addEventListener('popstate', () => goBack());

// Initial render
renderScreen('splash', 'fade-in');
setTimeout(() => { if (state.obStep === 'splash') go('welcome', 'fade-in'); }, 1200);
</script>
